<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pandorica - Something New is Coming">
    <title>Pandorica | Institutional Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>

    <div class="fixed-environment-layer"></div>

    <main class="master-scroll-container">
        
        <section class="cinematic-gate first-gate">
            <div class="sticky-viewport">
                <div class="hero-image-wrapper">
                    <img src="/logo.png" alt="Pandorica Prime Cube" class="center-piece-cube">
                    <div class="atmospheric-overlay"></div>
                </div>
            </div>
        </section>

        <section class="cinematic-gate text-gate">
            <div class="sticky-viewport">
                <div class="statement-reveal-group">
                    <div class="reveal-inner">
                        <span class="institutional-tag">ESTABLISHED 2025</span>
                        <h1 class="main-announcement">Something new is coming.</h1>
                        <div class="announcement-divider"></div>
                        <p class="announcement-sub">A digital paradigm shift is approaching. The architecture is finalizing. Don't miss the reveal.</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="cinematic-gate navigation-gate">
            <div class="sticky-viewport">
                <div class="nav-hub-content">
                    <h2 class="nav-header">Explore the Pandorica Protocol</h2>
                    <nav class="institutional-nav">
                        <div class="nav-item-wrapper">
                            <a href="mission.html" class="mega-nav-btn">
                                <span class="btn-number">01</span>
                                <span class="btn-text">Our Mission</span>
                                <span class="btn-desc">Architectural Integrity</span>
                            </a>
                        </div>
                        <div class="nav-item-wrapper">
                            <a href="timeline.html" class="mega-nav-btn">
                                <span class="btn-number">02</span>
                                <span class="btn-text">Timeline</span>
                                <span class="btn-desc">Release Schedule</span>
                            </a>
                        </div>
                    </nav>
                </div>
            </div>
        </section>

        <footer class="system-footer">
            <div class="footer-inner">
                <div class="footer-col">
                    <p class="copyright">&copy; 2025 PANDORICA PROTOCOL</p>
                </div>
                <div class="footer-col">
                    <p class="status-tag">SYSTEM STATUS: OPTIMAL</p>
                </div>
            </div>
        </footer>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
        });
    </script>
</body>
</html>
